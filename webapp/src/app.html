<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0d4554" />
		<meta name="color-scheme" content="dark" />
		<meta name="application-name" content="Tutifruti AI" />
		<meta name="apple-mobile-web-app-title" content="Tutifruti" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="icon" href="/favicon.png" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
		<!-- Google Analytics (etiqueta de Google GTM-MC4QR8DM, propiedad "Tutifruti AI"): solo en producción. -->
		<script>
			if (/(^|\.)tutifruti\.site$/.test(location.hostname)) {
				window.dataLayer = window.dataLayer || [];
				window.gtag = function () { dataLayer.push(arguments); };
				gtag('js', new Date());
				var s = document.createElement('script');
				s.async = true;
				s.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-MC4QR8DM';
				document.head.appendChild(s);
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
