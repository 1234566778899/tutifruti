name: Tutifruti
options:
  bundleIdPrefix: com.carlosordaz
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  Tutifruti:
    type: application
    platform: iOS
    sources:
      - path: Tutifruti
        excludes: ["Products.storekit"]
    info:
      path: Tutifruti/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.carlosordaz.tutifruti
            CFBundleURLSchemes: [tutifruti]
        CFBundleDisplayName: Tutifruti AI
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: logo_badge
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: Para elegir tu foto de perfil.
    entitlements:
      path: Tutifruti/Tutifruti.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: ["applinks:tutifruti-ai.vercel.app"]
        aps-environment: development
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carlosordaz.tutifruti
        DEVELOPMENT_TEAM: JZ9Z9GWH7P
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      storeKitConfiguration: Tutifruti/Products.storekit
      testTargets: [TutifrutiTests]
  TutifrutiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TutifrutiTests]
    dependencies:
      - target: Tutifruti
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.carlosordaz.tutifruti.tests
        DEVELOPMENT_TEAM: JZ9Z9GWH7P
        SWIFT_VERSION: "5.0"
